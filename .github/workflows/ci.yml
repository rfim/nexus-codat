name: ci
on:
  pull_request:
  push: {branches: [main]}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - run: pip install -r requirements.txt
      - name: MCP tools, consent and the agent evals (exported gold, no Spark)
        run: PYTHONPATH=src python -m pytest -q tests/test_mcp.py tests/test_semantic.py tests/test_contracts.py
      - name: Spark unit tests (replay, SCD2)
        run: PYTHONPATH=src python -m pytest -q tests/test_bronze.py tests/test_scd2.py
      - name: Full run on Spark + Delta, then check the site data is current
        run: ./scripts/build.sh && git diff --stat -- assets/data
