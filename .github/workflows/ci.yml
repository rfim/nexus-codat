name: ci
on:
  pull_request:
  push: {branches: [main]}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - run: pip install -r requirements.txt
      - name: The whole suite (pure Python, Spark + Delta, MCP evals, data and site checks)
        run: PYTHONPATH=src python -m pytest -q --junitxml=target/junit.xml
      - name: Test report for the site
        run: python scripts/test_report.py target/junit.xml target/tests.json
      - name: The code editor's file list is current
        run: python scripts/manifest.py && git diff --exit-code -- assets/data/files.json
      - name: Full run on Spark + Delta, then show what changed in the site data
        run: ./scripts/build.sh && git diff --stat -- assets/data
