name: ci
on:
  pull_request:
  push: {branches: [main]}
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # optional: with this secret the on-call agent is Claude (claude-opus-5-5); without it, offline rules
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - run: pip install -r requirements.txt
      - name: The whole suite (pure Python, Spark + Delta, MCP evals, data and site checks)
        run: PYTHONPATH=src python -m pytest -q --junitxml=target/junit.xml
      - name: Test report for the site
        run: python scripts/test_report.py target/junit.xml target/tests.json
      - name: The code editor's file list is current
        run: python scripts/manifest.py && git diff --exit-code -- assets/data/files.json
      - name: The whole graph through Dagster (Spark + Delta, SQL + GX checks, the on-call agent over MCP), then the site data diff
        run: ./scripts/build.sh && git diff --stat -- assets/data
